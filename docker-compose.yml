# ============================================================
# HandBrake Web - Docker Compose
#
# CPU only:  docker compose up -d
# NVIDIA GPU: Uncomment the deploy section below, then:
#             docker compose up -d
#
# Prerequisites for GPU:
#   - NVIDIA drivers on host
#   - nvidia-container-toolkit installed
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
# ============================================================

services:
  handbrake-web:
    build: .
    image: alex/handbrake-web:latest
    container_name: handbrake-web
    ports:
      - "3000:3000"
    volumes:
      - handbrake-data:/app/data        # SQLite database persistence
      - /media:/media                    # Media directories (adjust to your paths)
      # --- Unraid example paths (adjust to your shares) ---
      # - /mnt/user/media/peliculas:/media/peliculas
      # - /mnt/user/media/series:/media/series
      # - /mnt/user/media/encoded:/media/encoded
    environment:
      - NODE_ENV=production
    # --- Uncomment below for NVIDIA GPU encoding ---
    # environment:
    #   - NODE_ENV=production
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, compute]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  handbrake-data:
    driver: local

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#121212"/>

  <!-- Sidebar -->
  <rect width="180" height="500" fill="#0d0d0d"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Logo -->
  <rect x="16" y="16" width="148" height="40" rx="6" fill="#171717"/>
  <circle cx="38" cy="36" r="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="36" y="40" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">H</text>
  <text x="56" y="40" fill="white" font-size="13" font-weight="600">HandBrake</text>

  <!-- Nav: Dashboard -->
  <rect x="22" y="86" width="7" height="7" rx="1" fill="#888"/>
  <rect x="31" y="86" width="7" height="7" rx="1" fill="#888"/>
  <rect x="22" y="95" width="7" height="7" rx="1" fill="#888"/>
  <rect x="31" y="95" width="7" height="7" rx="1" fill="#888"/>
  <text x="46" y="99" fill="#999" font-size="13">Dashboard</text>

  <!-- Nav: Queue -->
  <rect x="22" y="122" width="16" height="2" rx="1" fill="#888"/>
  <rect x="22" y="127" width="16" height="2" rx="1" fill="#888"/>
  <rect x="22" y="132" width="16" height="2" rx="1" fill="#888"/>
  <text x="46" y="133" fill="#999" font-size="13">Queue</text>

  <!-- Nav: Presets -->
  <text x="46" y="169" fill="#999" font-size="13">Presets</text>
  <!-- Nav: Watchers -->
  <text x="46" y="200" fill="#999" font-size="13">Watchers</text>
  <!-- Nav: History -->
  <text x="46" y="232" fill="#999" font-size="13">History</text>

  <!-- Nav: Settings - Active -->
  <rect x="8" y="248" width="164" height="36" rx="6" fill="#22c55e" fill-opacity="0.15"/>
  <rect x="8" y="248" width="3" height="36" rx="1.5" fill="#22c55e"/>
  <circle cx="30" cy="266" r="7" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="30" cy="266" r="2.5" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="46" y="270" fill="#22c55e" font-size="13" font-weight="500">Settings</text>

  <!-- Main Content -->
  <text x="200" y="40" fill="white" font-size="20" font-weight="600">Settings</text>
  <text x="200" y="58" fill="#888" font-size="12">Configure application settings</text>

  <!-- Save button -->
  <rect x="700" y="22" width="80" height="34" rx="6" fill="#22c55e"/>
  <text x="724" y="43" fill="white" font-size="12" font-weight="600">Save</text>

  <!-- Scrollable content area -->
  <!-- Section 1: General -->
  <rect x="200" y="72" width="585" height="148" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="216" y="96" fill="white" font-size="14" font-weight="600">General</text>
  <line x1="216" y1="104" x2="769" y2="104" stroke="#2e2e2e" stroke-width="1"/>

  <!-- HandBrakeCLI Path -->
  <text x="216" y="124" fill="#ccc" font-size="11">HandBrakeCLI Path</text>
  <rect x="216" y="130" width="340" height="30" rx="4" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="228" y="149" fill="#888" font-size="11">/usr/bin/HandBrakeCLI</text>
  <rect x="562" y="130" width="60" height="30" rx="4" fill="#2e2e2e"/>
  <text x="575" y="149" fill="#ccc" font-size="10">Browse</text>

  <!-- Concurrent Limit -->
  <text x="640" y="124" fill="#ccc" font-size="11">Concurrent Limit</text>
  <rect x="640" y="130" width="60" height="30" rx="4" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="664" y="149" fill="white" font-size="12" font-weight="500">2</text>

  <!-- Output Directory -->
  <text x="216" y="178" fill="#ccc" font-size="11">Output Directory</text>
  <rect x="216" y="184" width="250" height="30" rx="4" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="228" y="203" fill="#888" font-size="11">/media/output</text>

  <!-- Output Pattern -->
  <text x="480" y="178" fill="#ccc" font-size="11">Output Pattern</text>
  <rect x="480" y="184" width="190" height="30" rx="4" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="492" y="203" fill="#888" font-size="11">{name}-{preset}.{ext}</text>

  <!-- Auto-start checkbox -->
  <rect x="716" y="124" width="14" height="14" rx="3" fill="#0d0d0d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="720" y="135" fill="#22c55e" font-size="9">&#10003;</text>
  <text x="735" y="136" fill="#ccc" font-size="10">Auto</text>

  <!-- Section 2: Schedule -->
  <rect x="200" y="230" width="585" height="140" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="216" y="254" fill="white" font-size="14" font-weight="600">Schedule</text>
  <!-- Enabled toggle -->
  <rect x="730" y="240" width="36" height="20" rx="10" fill="#22c55e"/>
  <circle cx="752" cy="250" r="7" fill="white"/>
  <line x1="216" y1="262" x2="769" y2="262" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Mode -->
  <text x="216" y="282" fill="#ccc" font-size="11">Mode</text>
  <rect x="216" y="288" width="140" height="28" rx="4" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <rect x="216" y="288" width="70" height="28" rx="4" fill="#22c55e" fill-opacity="0.2"/>
  <text x="228" y="306" fill="#22c55e" font-size="10" font-weight="500">Window</text>
  <text x="300" y="306" fill="#888" font-size="10">Always</text>

  <!-- Start time -->
  <text x="376" y="282" fill="#ccc" font-size="11">Start Time</text>
  <rect x="376" y="288" width="90" height="28" rx="4" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="390" y="307" fill="white" font-size="12" font-weight="500">22:00</text>

  <!-- End time -->
  <text x="480" y="282" fill="#ccc" font-size="11">End Time</text>
  <rect x="480" y="288" width="90" height="28" rx="4" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="494" y="307" fill="white" font-size="12" font-weight="500">06:00</text>

  <!-- Arrow between times -->
  <text x="472" y="307" fill="#888" font-size="14">&#8594;</text>

  <!-- Day buttons -->
  <text x="216" y="336" fill="#ccc" font-size="11">Active Days</text>
  <rect x="216" y="342" width="34" height="22" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.5"/>
  <text x="225" y="357" fill="#22c55e" font-size="9" font-weight="600">Mon</text>
  <rect x="254" y="342" width="34" height="22" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.5"/>
  <text x="264" y="357" fill="#22c55e" font-size="9" font-weight="600">Tue</text>
  <rect x="292" y="342" width="34" height="22" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.5"/>
  <text x="301" y="357" fill="#22c55e" font-size="9" font-weight="600">Wed</text>
  <rect x="330" y="342" width="34" height="22" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.5"/>
  <text x="339" y="357" fill="#22c55e" font-size="9" font-weight="600">Thu</text>
  <rect x="368" y="342" width="34" height="22" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.5"/>
  <text x="381" y="357" fill="#22c55e" font-size="9" font-weight="600">Fri</text>
  <rect x="406" y="342" width="34" height="22" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.5"/>
  <text x="417" y="357" fill="#22c55e" font-size="9" font-weight="600">Sat</text>
  <rect x="444" y="342" width="34" height="22" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="0.5"/>
  <text x="453" y="357" fill="#22c55e" font-size="9" font-weight="600">Sun</text>

  <text x="490" y="357" fill="#888" font-size="10">All days selected</text>

  <!-- Section 3: System Info -->
  <rect x="200" y="380" width="585" height="110" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="216" y="404" fill="white" font-size="14" font-weight="600">System Information</text>
  <line x1="216" y1="412" x2="769" y2="412" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Info grid -->
  <text x="216" y="434" fill="#888" font-size="11">HandBrake Version</text>
  <text x="216" y="450" fill="white" font-size="12" font-weight="500">1.8.0</text>

  <text x="360" y="434" fill="#888" font-size="11">CPU Cores</text>
  <text x="360" y="450" fill="white" font-size="12" font-weight="500">16 cores / 32 threads</text>

  <text x="540" y="434" fill="#888" font-size="11">Memory</text>
  <text x="540" y="450" fill="white" font-size="12" font-weight="500">32 GB DDR4</text>

  <text x="670" y="434" fill="#888" font-size="11">Disk Free</text>
  <text x="670" y="450" fill="white" font-size="12" font-weight="500">512 GB</text>

  <!-- OS info -->
  <text x="216" y="474" fill="#888" font-size="11">Operating System</text>
  <text x="216" y="484" fill="#ccc" font-size="10">Linux 6.1.0 x86_64</text>

  <text x="400" y="474" fill="#888" font-size="11">Node.js</text>
  <text x="400" y="484" fill="#ccc" font-size="10">v20.11.0</text>

  <text x="540" y="474" fill="#888" font-size="11">Uptime</text>
  <text x="540" y="484" fill="#ccc" font-size="10">4d 12h 33m</text>
</svg>
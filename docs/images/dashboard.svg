<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
    <clipPath id="card-clip"><rect rx="8"/></clipPath>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#121212"/>

  <!-- Sidebar -->
  <rect width="180" height="500" fill="#0d0d0d"/>
  <line x1="180" y1="0" x2="180" y2="500" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Logo area -->
  <rect x="16" y="16" width="148" height="40" rx="6" fill="#171717"/>
  <circle cx="38" cy="36" r="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="36" y="40" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">H</text>
  <text x="56" y="40" fill="white" font-size="13" font-weight="600">HandBrake</text>

  <!-- Nav Items -->
  <!-- Dashboard - Active -->
  <rect x="8" y="76" width="164" height="36" rx="6" fill="#22c55e" fill-opacity="0.15"/>
  <rect x="8" y="76" width="3" height="36" rx="1.5" fill="#22c55e"/>
  <!-- Dashboard icon (grid) -->
  <rect x="22" y="86" width="7" height="7" rx="1" fill="#22c55e"/>
  <rect x="31" y="86" width="7" height="7" rx="1" fill="#22c55e"/>
  <rect x="22" y="95" width="7" height="7" rx="1" fill="#22c55e"/>
  <rect x="31" y="95" width="7" height="7" rx="1" fill="#22c55e"/>
  <text x="46" y="99" fill="#22c55e" font-size="13" font-weight="500">Dashboard</text>

  <!-- Queue -->
  <rect x="22" y="126" width="16" height="2" rx="1" fill="#888"/>
  <rect x="22" y="131" width="16" height="2" rx="1" fill="#888"/>
  <rect x="22" y="136" width="16" height="2" rx="1" fill="#888"/>
  <text x="46" y="137" fill="#999" font-size="13">Queue</text>

  <!-- Presets -->
  <rect x="24" y="157" width="12" height="14" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <line x1="27" y1="162" x2="33" y2="162" stroke="#888" stroke-width="1"/>
  <line x1="27" y1="166" x2="33" y2="166" stroke="#888" stroke-width="1"/>
  <text x="46" y="169" fill="#999" font-size="13">Presets</text>

  <!-- Watchers -->
  <circle cx="30" cy="196" r="7" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="30" cy="196" r="2.5" fill="#888"/>
  <text x="46" y="200" fill="#999" font-size="13">Watchers</text>

  <!-- History -->
  <circle cx="30" cy="228" r="7" fill="none" stroke="#888" stroke-width="1.5"/>
  <polyline points="30,223 30,228 34,230" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="46" y="232" fill="#999" font-size="13">History</text>

  <!-- Settings -->
  <circle cx="30" cy="260" r="7" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="30" cy="260" r="2.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="46" y="264" fill="#999" font-size="13">Settings</text>

  <!-- Sidebar bottom user -->
  <line x1="8" y1="460" x2="172" y2="460" stroke="#2e2e2e" stroke-width="1"/>
  <circle cx="30" cy="480" r="12" fill="#2e2e2e"/>
  <text x="28" y="484" text-anchor="middle" fill="#888" font-size="10" font-weight="bold">A</text>
  <text x="48" y="484" fill="#999" font-size="12">Admin</text>

  <!-- Main Content Area -->
  <!-- Header -->
  <text x="200" y="40" fill="white" font-size="20" font-weight="600">Dashboard</text>
  <text x="200" y="58" fill="#888" font-size="12">Overview of your encoding system</text>

  <!-- Card 1: Active Jobs -->
  <rect x="200" y="78" width="190" height="130" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="216" y="100" fill="#888" font-size="11" font-weight="500">ACTIVE JOBS</text>
  <text x="216" y="128" fill="white" font-size="28" font-weight="700">1</text>
  <text x="245" y="128" fill="#888" font-size="13">encoding</text>
  <!-- File name -->
  <text x="216" y="150" fill="#ccc" font-size="11">movie_2024.mkv</text>
  <!-- Progress bar background -->
  <rect x="216" y="162" width="158" height="8" rx="4" fill="#2e2e2e"/>
  <!-- Progress bar fill -->
  <rect x="216" y="162" width="103" height="8" rx="4" fill="url(#greenGrad)"/>
  <text x="216" y="185" fill="#22c55e" font-size="11" font-weight="500">65%</text>
  <text x="340" y="185" fill="#888" font-size="10">ETA 12:34</text>

  <!-- Card 2: Queue -->
  <rect x="400" y="78" width="190" height="130" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="416" y="100" fill="#888" font-size="11" font-weight="500">QUEUE</text>
  <text x="416" y="128" fill="white" font-size="28" font-weight="700">3</text>
  <text x="445" y="128" fill="#888" font-size="13">pending</text>
  <!-- Mini list -->
  <circle cx="424" cy="148" r="3" fill="#3b82f6"/>
  <text x="432" y="152" fill="#ccc" font-size="10">series_s01e03.mkv</text>
  <circle cx="424" cy="163" r="3" fill="#6b7280"/>
  <text x="432" y="167" fill="#ccc" font-size="10">interview_raw.mp4</text>
  <circle cx="424" cy="178" r="3" fill="#6b7280"/>
  <text x="432" y="182" fill="#ccc" font-size="10">concert_4k.mov</text>

  <!-- Card 3: System Stats -->
  <rect x="600" y="78" width="185" height="130" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="616" y="100" fill="#888" font-size="11" font-weight="500">SYSTEM STATS</text>
  <!-- CPU -->
  <text x="616" y="120" fill="#ccc" font-size="11">CPU</text>
  <rect x="650" y="112" width="120" height="8" rx="4" fill="#2e2e2e"/>
  <rect x="650" y="112" width="90" height="8" rx="4" fill="url(#cpuGrad)"/>
  <text x="660" y="135" fill="#3b82f6" font-size="10">75%</text>
  <!-- Memory -->
  <text x="616" y="153" fill="#ccc" font-size="11">Memory</text>
  <rect x="665" y="145" width="105" height="8" rx="4" fill="#2e2e2e"/>
  <rect x="665" y="145" width="46" height="8" rx="4" fill="url(#memGrad)"/>
  <text x="660" y="168" fill="#a855f7" font-size="10">44%</text>
  <!-- Disk -->
  <text x="616" y="186" fill="#ccc" font-size="11">Disk</text>
  <rect x="650" y="178" width="120" height="8" rx="4" fill="#2e2e2e"/>
  <rect x="650" y="178" width="72" height="8" rx="4" fill="#f59e0b"/>
  <text x="660" y="200" fill="#f59e0b" font-size="10">60%</text>

  <!-- Card 4: Recent History -->
  <rect x="200" y="220" width="285" height="145" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="216" y="242" fill="#888" font-size="11" font-weight="500">RECENT HISTORY</text>
  <!-- History items -->
  <circle cx="224" cy="264" r="6" fill="#22c55e" fill-opacity="0.2"/>
  <text x="222" y="267" fill="#22c55e" font-size="9">&#10003;</text>
  <text x="236" y="268" fill="#ccc" font-size="11">vacation_edit.mp4</text>
  <text x="420" y="268" fill="#888" font-size="10">2m ago</text>

  <circle cx="224" cy="290" r="6" fill="#22c55e" fill-opacity="0.2"/>
  <text x="222" y="293" fill="#22c55e" font-size="9">&#10003;</text>
  <text x="236" y="294" fill="#ccc" font-size="11">presentation.mkv</text>
  <text x="420" y="294" fill="#888" font-size="10">1h ago</text>

  <circle cx="224" cy="316" r="6" fill="#22c55e" fill-opacity="0.2"/>
  <text x="222" y="319" fill="#22c55e" font-size="9">&#10003;</text>
  <text x="236" y="320" fill="#ccc" font-size="11">wedding_clip.mov</text>
  <text x="420" y="320" fill="#888" font-size="10">3h ago</text>

  <text x="216" y="352" fill="#22c55e" font-size="11" font-weight="500">View all history &#8594;</text>

  <!-- Card 5: Watchers -->
  <rect x="495" y="220" width="290" height="145" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="511" y="242" fill="#888" font-size="11" font-weight="500">WATCHERS</text>
  <text x="735" y="242" fill="#22c55e" font-size="11">2 active</text>

  <!-- Watcher 1 -->
  <rect x="511" y="254" width="258" height="40" rx="6" fill="#1e1e1e"/>
  <circle cx="527" cy="274" r="5" fill="#22c55e"/>
  <text x="538" y="270" fill="#ccc" font-size="11">/media/movies</text>
  <text x="538" y="284" fill="#888" font-size="9">Scanning every 60 min</text>
  <text x="725" y="278" fill="#888" font-size="10">2m ago</text>

  <!-- Watcher 2 -->
  <rect x="511" y="300" width="258" height="40" rx="6" fill="#1e1e1e"/>
  <circle cx="527" cy="320" r="5" fill="#22c55e"/>
  <text x="538" y="316" fill="#ccc" font-size="11">/media/series</text>
  <text x="538" y="330" fill="#888" font-size="9">Scanning every 30 min</text>
  <text x="720" y="324" fill="#888" font-size="10">15m ago</text>

  <text x="511" y="352" fill="#22c55e" font-size="11" font-weight="500">Manage watchers &#8594;</text>

  <!-- Footer bar -->
  <rect x="180" y="380" width="620" height="1" fill="#2e2e2e"/>

  <!-- Quick stats row -->
  <text x="200" y="410" fill="#888" font-size="11">HandBrakeCLI v1.8.0</text>
  <circle cx="370" cy="406" r="4" fill="#22c55e"/>
  <text x="380" y="410" fill="#ccc" font-size="11">System Online</text>
  <text x="540" y="410" fill="#888" font-size="11">Uptime: 4d 12h 33m</text>

  <!-- Encoding speed chart placeholder -->
  <rect x="200" y="425" width="585" height="65" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
  <text x="216" y="445" fill="#888" font-size="11" font-weight="500">ENCODING SPEED</text>
  <text x="700" y="445" fill="#888" font-size="10">Last 24h</text>
  <!-- Mini chart lines -->
  <polyline points="216,475 256,465 296,470 336,460 376,455 416,468 456,450 496,458 536,445 576,455 616,448 656,440 696,452 736,438 769,442" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.8"/>
  <polyline points="216,475 256,465 296,470 336,460 376,455 416,468 456,450 496,458 536,445 576,455 616,448 656,440 696,452 736,438 769,442" fill="url(#greenGrad)" fill-opacity="0.05" stroke="none"/>
  <text x="216" y="487" fill="#666" font-size="8">0h</text>
  <text x="489" y="487" fill="#666" font-size="8">12h</text>
  <text x="762" y="487" fill="#666" font-size="8">24h</text>
</svg>
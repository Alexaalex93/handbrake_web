<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#a855f7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#121212"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="white" font-size="18" font-weight="600">System Architecture</text>
  <text x="400" y="48" text-anchor="middle" fill="#888" font-size="11">HandBrake Web application architecture overview</text>

  <!-- Browser Box -->
  <rect x="30" y="80" width="160" height="100" rx="10" fill="#171717" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="30" y="80" width="160" height="28" rx="10" fill="#3b82f6" fill-opacity="0.15"/>
  <rect x="30" y="100" width="160" height="8" fill="#3b82f6" fill-opacity="0.15"/>
  <!-- Browser icon -->
  <circle cx="52" cy="94" r="7" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="68" y="98" fill="#3b82f6" font-size="11" font-weight="600">Browser</text>
  <!-- Browser contents -->
  <text x="48" y="125" fill="#ccc" font-size="10">React UI</text>
  <text x="48" y="140" fill="#888" font-size="9">Next.js Pages</text>
  <text x="48" y="155" fill="#888" font-size="9">SSE Event Listener</text>
  <text x="48" y="168" fill="#888" font-size="9">REST API Client</text>

  <!-- Arrow: Browser -> Next.js -->
  <line x1="190" y1="115" x2="270" y2="115" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="210" y="108" fill="#3b82f6" font-size="8">HTTP</text>
  <!-- Arrow: Next.js -> Browser (SSE) -->
  <line x1="270" y1="140" x2="190" y2="140" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="4,3"/>
  <text x="214" y="155" fill="#22c55e" font-size="8">SSE Events</text>

  <!-- Next.js Server Box (large) -->
  <rect x="280" y="70" width="260" height="280" rx="10" fill="#171717" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="280" y="70" width="260" height="28" rx="10" fill="#22c55e" fill-opacity="0.12"/>
  <rect x="280" y="90" width="260" height="8" fill="#22c55e" fill-opacity="0.12"/>
  <!-- Server icon -->
  <rect x="298" y="78" width="12" height="14" rx="2" fill="none" stroke="#22c55e" stroke-width="1.2"/>
  <line x1="300" y1="84" x2="308" y2="84" stroke="#22c55e" stroke-width="1"/>
  <text x="316" y="90" fill="#22c55e" font-size="12" font-weight="600">Next.js Server</text>

  <!-- Internal components -->
  <!-- API Routes -->
  <rect x="296" y="108" width="110" height="40" rx="6" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="320" y="125" fill="#3b82f6" font-size="9" font-weight="600">API Routes</text>
  <text x="310" y="140" fill="#888" font-size="8">/api/queue, /api/*</text>

  <!-- Event Bus -->
  <rect x="416" y="108" width="110" height="40" rx="6" fill="#0d0d0d" stroke="#f59e0b" stroke-width="1"/>
  <text x="443" y="125" fill="#f59e0b" font-size="9" font-weight="600">Event Bus</text>
  <text x="432" y="140" fill="#888" font-size="8">SSE / Pub-Sub</text>

  <!-- Queue Manager -->
  <rect x="296" y="162" width="110" height="44" rx="6" fill="#0d0d0d" stroke="#22c55e" stroke-width="1"/>
  <text x="309" y="180" fill="#22c55e" font-size="9" font-weight="600">Queue Manager</text>
  <text x="308" y="195" fill="#888" font-size="8">Job scheduling</text>

  <!-- Watcher Manager -->
  <rect x="416" y="162" width="110" height="44" rx="6" fill="#0d0d0d" stroke="#a855f7" stroke-width="1"/>
  <text x="423" y="180" fill="#a855f7" font-size="9" font-weight="600">Watcher Manager</text>
  <text x="432" y="195" fill="#888" font-size="8">File monitoring</text>

  <!-- Internal arrows -->
  <!-- API -> Queue Manager -->
  <line x1="351" y1="148" x2="351" y2="162" stroke="#888" stroke-width="1" marker-end="url(#arrowGray)"/>
  <!-- API -> Watcher -->
  <line x1="406" y1="138" x2="416" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Event Bus -> API -->
  <line x1="416" y1="128" x2="406" y2="128" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrowOrange)"/>
  <!-- Queue -> Event Bus -->
  <line x1="406" y1="175" x2="430" y2="148" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Watcher -> Queue -->
  <line x1="416" y1="184" x2="406" y2="184" stroke="#a855f7" stroke-width="1" marker-end="url(#arrowPurple)"/>

  <!-- Preset Manager -->
  <rect x="296" y="220" width="230" height="36" rx="6" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="370" y="242" fill="#888" font-size="9" font-weight="600">Preset Manager / Config Service</text>

  <!-- Process Pool -->
  <rect x="296" y="270" width="230" height="36" rx="6" fill="#0d0d0d" stroke="#ef4444" stroke-width="1"/>
  <text x="344" y="286" fill="#ef4444" font-size="9" font-weight="600">Process Pool</text>
  <text x="336" y="300" fill="#888" font-size="8">spawn &amp; manage CLIs</text>

  <!-- Arrow: Queue Manager -> Process Pool -->
  <line x1="351" y1="206" x2="351" y2="270" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="330" y="244" fill="#22c55e" font-size="7">spawn</text>

  <!-- HandBrakeCLI Processes -->
  <rect x="280" y="370" width="84" height="56" rx="8" fill="#171717" stroke="#ef4444" stroke-width="1.5"/>
  <text x="294" y="394" fill="#ef4444" font-size="9" font-weight="500">HB CLI</text>
  <text x="294" y="408" fill="#888" font-size="8">Process 1</text>
  <rect x="292" y="414" width="60" height="4" rx="2" fill="#2e2e2e"/>
  <rect x="292" y="414" width="39" height="4" rx="2" fill="#22c55e"/>

  <rect x="370" y="370" width="84" height="56" rx="8" fill="#171717" stroke="#ef4444" stroke-width="1.5"/>
  <text x="384" y="394" fill="#ef4444" font-size="9" font-weight="500">HB CLI</text>
  <text x="384" y="408" fill="#888" font-size="8">Process 2</text>
  <rect x="382" y="414" width="60" height="4" rx="2" fill="#2e2e2e"/>
  <rect x="382" y="414" width="18" height="4" rx="2" fill="#22c55e"/>

  <rect x="460" y="370" width="84" height="56" rx="8" fill="#171717" stroke="#2e2e2e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="474" y="394" fill="#888" font-size="9" font-weight="500">HB CLI</text>
  <text x="474" y="408" fill="#666" font-size="8">Process N</text>

  <!-- Arrow: Process Pool -> CLI processes -->
  <line x1="380" y1="306" x2="322" y2="370" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="4,3"/>
  <line x1="410" y1="306" x2="412" y2="370" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="4,3"/>

  <!-- SQLite Database -->
  <rect x="610" y="100" width="150" height="70" rx="10" fill="#171717" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="610" y="100" width="150" height="26" rx="10" fill="#f59e0b" fill-opacity="0.12"/>
  <rect x="610" y="120" width="150" height="6" fill="#f59e0b" fill-opacity="0.12"/>
  <!-- DB icon -->
  <ellipse cx="632" cy="112" rx="7" ry="4" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="625" y1="112" x2="625" y2="120" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="639" y1="112" x2="639" y2="120" stroke="#f59e0b" stroke-width="1.2"/>
  <ellipse cx="632" cy="120" rx="7" ry="3" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="646" y="116" fill="#f59e0b" font-size="11" font-weight="600">SQLite</text>
  <text x="626" y="145" fill="#888" font-size="9">Jobs, History,</text>
  <text x="626" y="157" fill="#888" font-size="9">Presets, Config</text>

  <!-- Arrow: API Routes -> SQLite -->
  <line x1="406" y1="124" x2="416" y2="124" stroke="transparent"/>
  <line x1="540" y1="128" x2="610" y2="135" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="560" y="122" fill="#f59e0b" font-size="8">read/write</text>

  <!-- Filesystem / Input -->
  <rect x="610" y="210" width="150" height="60" rx="10" fill="#171717" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="610" y="210" width="150" height="26" rx="10" fill="#a855f7" fill-opacity="0.12"/>
  <rect x="610" y="230" width="150" height="6" fill="#a855f7" fill-opacity="0.12"/>
  <!-- Folder icon -->
  <rect x="626" y="219" width="12" height="9" rx="1" fill="none" stroke="#a855f7" stroke-width="1.2"/>
  <rect x="626" y="217" width="6" height="3" rx="1" fill="none" stroke="#a855f7" stroke-width="1.2"/>
  <text x="644" y="228" fill="#a855f7" font-size="11" font-weight="600">Input Files</text>
  <text x="626" y="253" fill="#888" font-size="9">/media/movies/</text>
  <text x="626" y="264" fill="#888" font-size="9">/media/series/</text>

  <!-- Arrow: Watcher -> Filesystem -->
  <line x1="526" y1="184" x2="610" y2="240" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="554" y="202" fill="#a855f7" font-size="8">scan</text>

  <!-- Output Folder -->
  <rect x="610" y="310" width="150" height="60" rx="10" fill="#171717" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="610" y="310" width="150" height="26" rx="10" fill="#22c55e" fill-opacity="0.12"/>
  <rect x="610" y="330" width="150" height="6" fill="#22c55e" fill-opacity="0.12"/>
  <rect x="626" y="319" width="12" height="9" rx="1" fill="none" stroke="#22c55e" stroke-width="1.2"/>
  <rect x="626" y="317" width="6" height="3" rx="1" fill="none" stroke="#22c55e" stroke-width="1.2"/>
  <text x="644" y="328" fill="#22c55e" font-size="11" font-weight="600">Output Files</text>
  <text x="626" y="353" fill="#888" font-size="9">/media/output/</text>

  <!-- Arrow: CLI -> Input -->
  <line x1="364" y1="390" x2="610" y2="250" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Arrow: CLI -> Output -->
  <line x1="454" y1="410" x2="610" y2="340" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="536" y="388" fill="#22c55e" font-size="8">write</text>

  <!-- Legend -->
  <rect x="30" y="430" width="740" height="50" rx="8" fill="#0d0d0d" stroke="#2e2e2e" stroke-width="1"/>
  <text x="50" y="452" fill="#888" font-size="10" font-weight="600">Legend:</text>
  <line x1="100" y1="450" x2="130" y2="450" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="454" fill="#888" font-size="9">HTTP Request</text>
  <line x1="210" y1="450" x2="240" y2="450" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="245" y="454" fill="#888" font-size="9">SSE Events</text>
  <line x1="320" y1="450" x2="350" y2="450" stroke="#f59e0b" stroke-width="2"/>
  <text x="355" y="454" fill="#888" font-size="9">Data Store</text>
  <line x1="420" y1="450" x2="450" y2="450" stroke="#a855f7" stroke-width="2"/>
  <text x="455" y="454" fill="#888" font-size="9">File System</text>
  <line x1="530" y1="450" x2="560" y2="450" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="565" y="454" fill="#888" font-size="9">Process Spawn</text>

  <text x="50" y="470" fill="#666" font-size="8">Arrows indicate direction of data flow. Dashed lines represent async/event-driven communication.</text>
</svg>